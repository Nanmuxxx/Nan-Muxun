<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桪言 · 让文字自然成形</title><link rel="stylesheet" href="style.css"><body><header><div class="brand">桪<span>言</span><small>MARKDOWN STUDIO</small></div><div class="actions"><button id="save">保存草稿</button><button id="import">↥ 导入 Markdown</button><button id="download">↓ 导出 .md</button><button class="primary" id="pdf">导出 PDF ↗</button></div></header><div class="workspace"><aside><div class="eyebrow">你的写作空间</div><h2>把想法，<br>写成作品。</h2><p>专注表达，排版交给桪言。</p><button id="new">＋ 新建文档</button><div class="label">我的草稿 <span id="draftCount"></span></div><div id="drafts"></div><button id="restore" class="restore">恢复最近删除</button><p class="storage-note">草稿保存在当前浏览器，可随时切换。重要文档请导出备份。</p><div class="label">文档大纲</div><nav id="outline"></nav><div class="tip">轻松开始<br><span>选中文字后，用工具栏设置样式。点击文字定位光标；点击文末空白处，可在相应位置开始写作。</span></div></aside><main><div class="dochead"><div><input id="name" aria-label="文档名称" value="我的第一篇文档"><div id="saved">所有修改自动保存在此浏览器</div></div><div class="tabs"><button id="visual" class="selected">可视化</button><button id="source">Markdown</button></div></div><div class="toolbar" role="toolbar" aria-label="排版工具"><select id="font" aria-label="字体" title="选中文字设置字体；未选中时用于接下来输入的文字"><option value="system">系统 · 苹方风格</option><option value="song">书卷 · 宋体</option><option value="kai">手写 · 楷体</option><option value="round">柔和 · 圆体</option><option value="mono">整齐 · 等宽</option></select><select id="format" aria-label="段落样式"><option value="p">正文</option><option value="h1">标题 1</option><option value="h2">标题 2</option><option value="h3">标题 3</option><option value="blockquote">引用</option><option value="pre">代码块</option></select><i></i><button data-cmd="bold" title="粗体"><b>B</b></button><button data-cmd="italic" title="斜体"><em>I</em></button><button data-cmd="strikeThrough" title="删除线"><s>S</s></button><div class="palette" role="group" aria-label="字体颜色"><button class="swatch" data-color="#283c38" style="--swatch:#283c38" title="墨黑" aria-label="墨黑"></button><button class="swatch" data-color="#f5f3eb" style="--swatch:#f5f3eb" title="暖白" aria-label="暖白"></button><button class="swatch" data-color="#7b8580" style="--swatch:#7b8580" title="岩灰" aria-label="岩灰"></button><button class="swatch" data-color="#587b91" style="--swatch:#587b91" title="雾蓝" aria-label="雾蓝"></button><button class="swatch" data-color="#527761" style="--swatch:#527761" title="松绿" aria-label="松绿"></button><button class="swatch" data-color="#b16c66" style="--swatch:#b16c66" title="陶红" aria-label="陶红"></button></div><button data-cmd="justifyLeft" title="左对齐">左对齐</button><button data-cmd="justifyCenter" title="居中对齐">居中</button><button data-cmd="justifyRight" title="右对齐">右对齐</button><i></i><button data-cmd="insertUnorderedList" title="项目符号">☷ 列表</button><button data-cmd="insertOrderedList" title="编号列表">≡ 编号</button><button id="codeblock" title="插入代码块">〈/〉代码块</button><button id="photo" title="插入照片">▧ 照片</button><button id="table" title="插入表格">▦ 表格</button><button id="link" title="插入链接">↗ 链接</button><button data-cmd="insertHorizontalRule" title="分隔线">—</button><i></i><button data-cmd="undo" title="撤销">↶</button><button data-cmd="redo" title="重做">↷</button></div><div id="image-tools" class="image-tools" role="toolbar" aria-label="照片调整" hidden><strong>照片</strong><label>宽度 <input id="image-size" type="range" min="10" max="100" step="1" value="100" aria-label="照片宽度"><output id="image-size-label">100%</output></label><button data-image-align="left">靠左</button><button data-image-align="center">居中</button><button data-image-align="right">靠右</button><button id="image-up">↑ 上移</button><button id="image-down">↓ 下移</button><button id="image-done">完成</button><small>可拖动照片到其他段落前后；保持原比例缩放</small></div><div class="canvas"><article id="editor" contenteditable="true" spellcheck="false" aria-label="文档编辑区"></article><textarea id="markdown" aria-label="Markdown 源码" hidden></textarea></div><footer><span><span class="dot"></span> 本地草稿</span><span id="count"></span><span>A4 · PDF 排版</span></footer></main></div><input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden><input type="file" id="file" accept=".md,.markdown,.txt,text/plain" hidden><div id="toast" role="status"></div><script src="vendor/marked.js"></script><script src="vendor/turndown.js"></script><script src="vendor/purify.js"></script><script src="vendor/html2pdf.js"></script><script src="app.js"></script></body></html>
